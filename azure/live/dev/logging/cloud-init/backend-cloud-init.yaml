#cloud-config
package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  - apt-transport-https
  - openjdk-17-jre-headless
  - uuid-runtime
  - pwgen
  - curl
  - gnupg
  - jq
  - dirmngr
  - haveged

write_files:
  - path: /etc/mongod.conf
    content: |
      storage:
        dbPath: /var/lib/mongodb
        journal:
          enabled: true
      systemLog:
        destination: file
        logAppend: true
        path: /var/log/mongodb/mongod.log
      net:
        port: 27017
        bindIp: 0.0.0.0
  - path: /etc/opensearch/opensearch.yml
    content: |
      cluster.name: graylog-cluster
      node.name: graylog
      path.data: /var/lib/opensearch
      path.logs: /var/log/opensearch
      discovery.type: single-node
      network.host: 0.0.0.0
      action.auto_create_index: false
      plugins.security.disabled: true
  - path: /etc/opensearch/jvm.options
    content: |
      -Xms2g
      -Xmx2g

runcmd:
  # Set timezone
  - timedatectl set-timezone UTC

  # Install MongoDB - Fixed key import
  - curl -fsSL https://www.mongodb.org/static/pgp/server-6.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-server-6.0.gpg
  - echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
  - apt-get update
  - apt-get install -y mongodb-org
  - mkdir -p /var/lib/mongodb /var/log/mongodb
  - chown -R mongodb:mongodb /var/lib/mongodb /var/log/mongodb
  - systemctl enable mongod.service
  - systemctl start mongod.service

  # Create MongoDB user (with error handling)
  - |
    until systemctl is-active --quiet mongod; do sleep 1; done
    ACCESS_TOKEN=$(curl -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net' -H Metadata:true | jq -r .access_token)
    MONGO_PASS=$(curl -s "https://${key_vault_name}.vault.azure.net/secrets/${mongodb_password_name}?api-version=7.3" -H "Authorization: Bearer $ACCESS_TOKEN" | jq -r .value)
    mongo admin --eval 'db.createUser({user: "graylog", pwd: "'"$MONGO_PASS"'", roles: [{role: "readWrite", db: "graylog"}]})' || echo "MongoDB user creation failed"

  # Install OpenSearch
  - curl -o- https://artifacts.opensearch.org/publickeys/opensearch.pgp | gpg --dearmor -o /usr/share/keyrings/opensearch-keyring
  - echo "deb [signed-by=/usr/share/keyrings/opensearch-keyring] https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main" > /etc/apt/sources.list.d/opensearch-2.x.list
  - apt-get update
  - apt-get install -y opensearch
  - echo "vm.max_map_count=262144" >> /etc/sysctl.conf
  - sysctl -p
  - mkdir -p /var/lib/opensearch /var/log/opensearch
  - chown -R opensearch:opensearch /var/lib/opensearch /var/log/opensearch
  - systemctl enable opensearch.service
  - systemctl start opensearch.service

  # Verify services
  - curl -s -XGET "http://localhost:9200/_cluster/health?pretty" || echo "OpenSearch not ready"
  - mongo --eval "db.runCommand({ping:1})" || echo "MongoDB not ready"