#cloud-config
package_update: true
package_upgrade: true
package_reboot_if_required: true

packages:
  - gnupg
  - curl
  - net-tools
  - pwgen
  - haveged

write_files:
  - path: /etc/mongod.conf
    content: |
      storage:
        dbPath: /var/lib/mongodb
      systemLog:
        destination: file
        path: /var/log/mongodb/mongod.log
        logAppend: true
      net:
        port: 27017
        bindIp: 0.0.0.0
    owner: root:root
    permissions: '0644'

runcmd:
  # Set timezone
  - timedatectl set-timezone UTC

  # Create MongoDB user and directories
  - adduser --system --group --no-create-home --disabled-login mongodb
  - mkdir -p /var/lib/mongodb /var/log/mongodb
  - chown -R mongodb:mongodb /var/lib/mongodb /var/log/mongodb

  # Add MongoDB key
  - curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
  - echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list

  # Install MongoDB
  - apt-get update
  - apt-get install -y mongodb-org
  - echo "mongodb-org hold" | sudo dpkg --set-selections
  - echo "mongodb-org-database hold" | sudo dpkg --set-selections
  - echo "mongodb-org-server hold" | sudo dpkg --set-selections
  - echo "mongodb-mongosh hold" | sudo dpkg --set-selections
  - echo "mongodb-org-mongos hold" | sudo dpkg --set-selections
  - echo "mongodb-org-tools hold" | sudo dpkg --set-selections
  
  # Fix service file permissions
  - sed -i 's/^User=.*/User=mongodb/' /lib/systemd/system/mongod.service
  - sed -i 's/^Group=.*/Group=mongodb/' /lib/systemd/system/mongod.service
  
  # Start MongoDB
  - systemctl daemon-reload
  - systemctl enable mongod
  - systemctl start mongod

  # Install OpenSearch
  - curl -o- https://artifacts.opensearch.org/publickeys/opensearch.pgp | sudo gpg --dearmor --batch --yes -o /usr/share/keyrings/opensearch-keyring
  - echo "deb [signed-by=/usr/share/keyrings/opensearch-keyring] https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main" | sudo tee /etc/apt/sources.list.d/opensearch-2.x.list
  - apt-get update
  - export OPENSEARCH_INITIAL_ADMIN_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)
  - apt-get install -y opensearch=2.10.0
  - apt-mark hold opensearch

  # Configure OpenSearch
  - |
    cat <<EOF > /etc/opensearch/opensearch.yml
    cluster.name: graylog-cluster
    node.name: graylog
    path.data: /var/lib/opensearch
    path.logs: /var/log/opensearch
    discovery.type: single-node
    network.host: 0.0.0.0
    action.auto_create_index: false
    plugins.security.disabled: true
    EOF

  - |
    cat <<EOF > /etc/opensearch/jvm.options
    -Xms2g
    -Xmx2g
    EOF

  # Set kernel settings
  - sysctl -w vm.max_map_count=262144
  - echo 'vm.max_map_count=262144' | sudo tee -a /etc/sysctl.conf

  # Start OpenSearch
  - systemctl daemon-reload
  - systemctl enable opensearch.service
  - systemctl start opensearch.service

  # Output connection info
  - |
    echo "Backend services installed!"
    echo "MongoDB URI: mongodb://$(hostname -I | awk '{print $1}'):27017/graylog"
    echo "OpenSearch URL: http://$(hostname -I | awk '{print $1}'):9200"
